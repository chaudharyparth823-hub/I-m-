<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I-m- | Welcome</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111, #333);
      color: white;
      text-align: center;
    }

    .box {
      padding: 40px 25px;
      max-width: 600px;
    }

    h1 {
      font-size: 55px;
      margin-bottom: 15px;
    }

    p {
      font-size: 20px;
      color: #ddd;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: white;
      color: #111;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
    }

    .btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Hello 👋</h1>
    <p>Welcome to my website.</p>
    <a class="btn" href="#">Explore</a>
  </div>
</body>
</html>
